<div class="container-fluid mt-4">
    <h2 class="fw-bold mb-4">
        <i class="fas fa-heartbeat text-danger"></i> Record Vitals
    </h2>

    <div ng-if="!cvr && loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-3">Loading CVR details...</p>
    </div>

    <div ng-if="cvr" class="alert alert-info mb-3">
        <strong>CVR:</strong> {{cvr.cvrNumber}} &nbsp;|&nbsp;
        <strong>Patient:</strong> {{cvr.patientName}} &nbsp;|&nbsp;
        <strong>PIN:</strong> {{cvr.pinNumber}}
    </div>

    <div class="card" ng-if="cvr">
        <div class="card-body">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Temperature (°F) <span class="text-danger">*</span></label>
                    <input type="number" step="0.1" class="form-control" 
                           ng-model="vitals.temperatureF" placeholder="98.6">
                    <small class="text-muted">Normal: 97.0 - 99.5°F</small>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Blood Pressure <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" ng-model="vitals.bloodPressure" 
                           placeholder="120/80" ng-blur="validateBloodPressure()">
                    <small class="text-danger" ng-if="bpError">{{bpError}}</small>
                    <small class="text-muted" ng-if="!bpError">Format: 120/80</small>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Pulse Rate (bpm) <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" 
                           ng-model="vitals.pulseRate" placeholder="72">
                    <small class="text-muted">Normal: 60-100 bpm</small>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">SpO2 (%)</label>
                    <input type="number" class="form-control" 
                           ng-model="vitals.spo2Percentage" placeholder="98">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Respiratory Rate (/min)</label>
                    <input type="number" class="form-control" 
                           ng-model="vitals.respiratoryRate" placeholder="16">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Weight (kg)</label>
                    <input type="number" step="0.1" class="form-control" 
                           ng-model="vitals.weightKg" ng-change="calculateBMI()" placeholder="70">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Height (cm)</label>
                    <input type="number" step="0.1" class="form-control" 
                           ng-model="vitals.heightCm" ng-change="calculateBMI()" placeholder="170">
                </div>
                <div class="col-md-4 mb-3" ng-if="bmi">
                    <label class="form-label">BMI</label>
                    <input type="text" class="form-control" 
                           ng-value="bmi + ' (' + bmiCategory + ')'" readonly>
                </div>
            </div>

            <div class="mt-4">
                <button class="btn btn-success btn-lg me-2" 
                        ng-click="recordVitals()" ng-disabled="loading">
                    <i class="fas fa-save"></i> {{loading ? 'Saving...' : 'Save Vitals'}}
                </button>
                <button class="btn btn-outline-danger btn-lg" ng-click="cancel()">
                    <i class="fas fa-times"></i> Cancel
                </button>
            </div>
        </div>
    </div>
</div>
