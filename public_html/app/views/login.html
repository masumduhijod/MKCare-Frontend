<!-- Login Page -->
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-md-5">
            <div class="card shadow-lg">
                <div class="card-body p-5">
                    <!-- Logo and Title -->
                    <div class="text-center mb-4">
                        <i class="fas fa-hospital fa-3x text-primary mb-3"></i>
                        <h2 class="fw-bold">Hospital Management System</h2>
                        <p class="text-muted">Sign in to continue</p>
                    </div>

                    <!-- Error Alert -->
                    <div ng-if="error" class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-circle"></i> {{error}}
                        <button type="button" class="btn-close" ng-click="clearError()"></button>
                    </div>

                    <!-- Login Form -->
                    <form ng-submit="login()" name="loginForm">
                        <!-- Username -->
                        <div class="mb-3">
                            <label class="form-label">
                                <i class="fas fa-user"></i> Username
                            </label>
                            <input type="text" 
                                   class="form-control form-control-lg" 
                                   ng-model="credentials.username"
                                   placeholder="Enter username"
                                   required
                                   autofocus>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label class="form-label">
                                <i class="fas fa-lock"></i> Password
                            </label>
                            <input type="password" 
                                   class="form-control form-control-lg" 
                                   ng-model="credentials.password"
                                   placeholder="Enter password"
                                   required>
                        </div>

                        <!-- Remember Me -->
                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">
                                Remember me
                            </label>
                        </div>

                        <!-- Login Button -->
                        <button type="submit" 
                                class="btn btn-primary btn-lg w-100"
                                ng-disabled="loading || !credentials.username || !credentials.password">
                            <span ng-if="!loading">
                                <i class="fas fa-sign-in-alt"></i> Sign In
                            </span>
                            <span ng-if="loading">
                                <span class="spinner-border spinner-border-sm" role="status"></span>
                                Signing in...
                            </span>
                        </button>
                    </form>

                    <!-- Footer -->
                    <div class="text-center mt-4">
                        <p class="text-muted mb-0">
                            <small>© 2025 Hospital Management System. All rights reserved.</small>
                        </p>
                    </div>
                </div>
            </div>

            
        </div>
    </div>
</div>

<style>
    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
</style>
