<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Report</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            color: #000;
            margin: 0;
            padding: 80px 30px 30px 30px;
        }
        #print-container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 1000px;
            margin: 0 auto;
        }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #1e293b;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .logo-container {
            width: 120px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        .logo-container img {
            max-width: 100%;
            max-height: 80px;
            object-fit: contain;
        }
        .clinic-info {
            text-align: center;
            flex-grow: 1;
            padding: 0 15px;
        }
        .clinic-info h2 {
            margin: 0;
            font-weight: bold;
            color: #1e293b;
            font-size: 1.8rem;
        }
        .clinic-info p {
            margin: 5px 0 0;
            font-size: 1rem;
            color: #475569;
        }
        .meta-info {
            text-align: right;
            font-size: 0.85rem;
            width: 200px;
        }
        .report-title-display {
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
            color: #0f172a;
            text-decoration: underline;
        }
        
        /* Table enhancements for print */
        table {
            width: 100% !important;
            border-collapse: collapse !important;
            margin-bottom: 20px !important;
        }
        th {
            background-color: #e2e8f0 !important;
            color: #1e293b !important;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        thead {
            display: table-header-group;
        }
        tr {
            page-break-inside: avoid;
        }
        
        /* Utility */
        .badge {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
            border: 1px solid #ccc;
            color: #000 !important;
            background: #f8f9fa !important;
        }
        .bg-success, .bg-primary, .bg-warning, .bg-danger, .bg-info, .bg-secondary {
            background-color: transparent !important;
            color: #000 !important;
            border: 1px solid #000;
        }

        /* Action Bar */
        .action-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #1e293b;
            padding: 12px 30px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            z-index: 1000;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
        }
        .action-bar button {
            padding: 8px 20px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .btn-print { background: #3b82f6; color: white; }
        .btn-print:hover { background: #2563eb; }
        .btn-close-window { background: #e2e8f0; color: #1e293b; }
        .btn-close-window:hover { background: #cbd5e1; }

        @media print {
            body {
                padding: 0;
                background-color: #fff;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            #print-container {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
            }
            @page {
                margin: 1cm;
            }
            .no-print {
                display: none !important;
            }
            /* Grid fallback for print */
            .col-6 { width: 50% !important; }
            .col-md-3 { width: 25% !important; }
            .row { display: flex !important; flex-wrap: wrap !important; width: 100%; }
        }
            @page {
                margin: 1cm;
            }
            .no-print {
                display: none !important;
            }
            /* Grid fallback for print */
            .col-6 { width: 50% !important; float: left; }
            .col-md-3 { width: 25% !important; float: left; }
            .row { display: flex; flex-wrap: wrap; clear: both; }
        }
    </style>
</head>
<body>

<div class="action-bar no-print">
    <button class="btn-print" onclick="window.print()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
        Print Report
    </button>
    <button class="btn-close-window" onclick="window.close()">Close</button>
</div>

<div id="print-container"></div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const dataStr = localStorage.getItem('printReportData');
        if (!dataStr) {
            document.getElementById('print-container').innerHTML = '<div class="alert alert-danger m-4">No report data found. Please go back and try again.</div>';
            return;
        }
        
        try {
            const data = JSON.parse(dataStr);
            const container = document.getElementById('print-container');
            
            // Logo rendering
            let logoHtml = '';
            if (data.clinicLogo) {
                logoHtml = `<img src="${data.clinicLogo}" alt="Clinic Logo">`;
            } else {
                logoHtml = `<div style="width: 60px; height: 60px; background: #6366f1; color: white; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 24px; font-weight: bold;">+</div>`;
            }

            // Header
            const headerHtml = `
                <div class="header-section">
                    <div class="logo-container">
                        ${logoHtml}
                    </div>
                    <div class="clinic-info">
                        <h2>${data.clinicName}</h2>
                        <p>${data.clinicAddress}</p>
                        <p><strong>Mob:</strong> ${data.clinicPhone}</p>
                    </div>
                    <div class="meta-info">
                        <div class="mb-1"><strong>Printed By:</strong> ${data.loginName}</div>
                        <div class="mb-1"><strong>Role:</strong> ${data.role}</div>
                        <div class="mb-1"><strong>Date:</strong> ${data.dateTime}</div>
                    </div>
                </div>
                <div class="report-title-display">${data.reportTitle}</div>
            `;
            
            container.innerHTML = headerHtml + data.contentHtml;
            
        } catch (e) {
            console.error("Error generating print view:", e);
            document.getElementById('print-container').innerHTML = '<div class="alert alert-danger m-4">Error processing report data.</div>';
        }
    });
</script>
</body>
</html>
